# Weekly, and grouped, so updates arrive as a few pull requests rather than one per package.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /CanfarDesktop.Tests
      - /CanfarDesktop.McpBridge
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
